# This repo's own workflow. Directories are states, a transition moves an item
# between them, and keys are the facts an item's head carries. A state's, a
# key's or a transition's `doc =` points at the section of docs/method.md that
# explains the word.

# The files an agent tool reads from the directory it works in, which no
# state directory reads as items. Every other `*.md` there is an item or a
# refusal. See docs/method.md#ignore.
[fileplan]
ignore = ["CLAUDE.md", "AGENTS.md"]

# Ideas that are not queued.
[states.someday-maybe]
path = "someday-maybe"
doc  = "docs/method.md#someday-maybe"

# Sections being worked. Ordered, claimed by one session at a time,
# numbered and cut into sub-phases. `sort` lists them by
# the places `queue` and `requeue` give them.
# See docs/method.md#sub-phases, docs/method.md#bulleted and
# docs/method.md#the-queue.
[states.plan]
path              = "plan"
doc               = "docs/method.md#plan"
capabilities      = ["queued", "claimed", "numbered", "bulleted"]
sort              = "position"
archive           = "docs/plan-archive.md"
sub-phases        = "Sub-phases"
sub-phase-pending = "**pending — Decompose the rest of this section.**"
sub-phase-name    = "{number}-{ordinal}"
sub-phase-cursor  = "sub-phase"
sub-phase-status  = "sub-phase-status"
# The key that holds what a section waits on. See docs/method.md#dependencies.
dependencies      = "after"

# Sections we chose not to do.
[states.abandoned]
path   = "abandoned"
doc    = "docs/method.md#abandoned"
# Left out of a plain `fileplan list`; `--state abandoned` lists it.
listed = false

# Open investigations. Each holds findings as bullets named f1, f2, ...
# `opened-for` names the key holding the section it was opened for, which is
# what the dangle check looks up. See docs/method.md#the-dangle-check.
[states.carrier]
path              = "carriers"
doc               = "docs/method.md#carrier"
capabilities      = ["bulleted"]
sub-phases        = "Findings"
sub-phase-pending = "**pending — The investigation is still open.**"
sub-phase-name    = "f{ordinal}"
opened-for        = "opened-for"
# Left out of a plain `fileplan list`; `--state carrier` lists it.
listed            = false

# `title` is not declared here. Every item has one. See docs/method.md#title.

# The design document. No transition declared here drops it.
[keys.draft]
doc  = "docs/method.md#draft"
help = "The document this item's design lives in."

[keys.size]
doc    = "docs/method.md#size"
help   = "How much work the item is."
values = ["S", "M", "L", "XL"]

[keys.after]
doc  = "docs/method.md#dependencies"
help = "The sections this item waits on, by slug."

# Where a filed finding came from. See docs/method.md#filing.
[keys.carried-from]
doc  = "docs/method.md#carried-from"
help = "The carrier this item was filed from."

[keys.carried]
doc  = "docs/method.md#carried"
help = "The finding, by the name its bullet carries."

# What a carrier was opened for.
[keys.opened-for]
doc  = "docs/method.md#opened-for"
help = "The section this carrier was opened for, by slug."

[keys.opened-in]
doc  = "docs/method.md#opened-in"
help = "The sub-phase this carrier was opened for, by the name its bullet carries."

# The cursor over a section's sub-phases.
[keys.sub-phase]
doc  = "docs/method.md#the-cursor"
help = "Which sub-phase is current, by the name its bullet carries."

[keys.sub-phase-status]
doc    = "docs/method.md#sub-phase-status"
help   = "How far the current sub-phase has got."
values = ["open", "planned", "in progress"]

[transitions.idea]
kind = "create"
doc  = "docs/method.md#idea"
help = "File a new idea into someday-maybe."
to   = "someday-maybe"

[transitions.queue]
kind = "move"
doc  = "docs/method.md#queue"
help = "Commit to an idea: move it into the plan, at a place in the order."
from = "someday-maybe"
to   = "plan"

[transitions.requeue]
kind = "reorder"
doc  = "docs/method.md#requeue"
help = "Move an item to another place in the plan's order."
from = "plan"

# A new title makes a new slug, so the file moves and every reference to the
# old slug follows it. Declared twice, once in each state an item is renamed
# in.
[transitions.retitle]
kind = "rename"
doc  = "docs/method.md#retitle"
help = "Give a section a new title, and move it to the slug that makes."
from = "plan"

[transitions.retitle-idea]
kind = "rename"
doc  = "docs/method.md#retitle-idea"
help = "Give an idea a new title, and move it to the slug that makes."
from = "someday-maybe"

# A transition's `doc` section links to the procedure a session follows
# around the run, where there is one. See docs/method.md#the-interpreter.
[transitions.decompose]
kind = "add-bullet"
doc  = "docs/method.md#decompose"
help = "Write the next sub-phase into a section, or close the decomposition."
from = "plan"

[transitions.work]
kind   = "edit"
doc    = "docs/method.md#work"
help   = "Take up a section, and say which sub-phase you are on."
from   = "plan"
claims = true
sets   = ["sub-phase", "sub-phase-status"]

# Ending a sub-phase marks its bullet and drops the status key.
# See docs/method.md#sub-phase-status.
[transitions.finish]
kind  = "mark-bullet"
doc   = "docs/method.md#finish"
help  = "Say a sub-phase is finished."
from  = "plan"
marks = "done"
drops = ["sub-phase-status"]

[transitions.skip]
kind  = "mark-bullet"
doc   = "docs/method.md#skip"
help  = "Say a sub-phase will not be done."
from  = "plan"
marks = "skipped"
drops = ["sub-phase-status"]

# Writes under a sub-phase's bullet, never on its own line, so neither the
# mark nor the cursor moves. See docs/method.md#annotate.
[transitions.annotate]
kind = "write-bullet"
doc  = "docs/method.md#annotate"
help = "Write under a sub-phase: what was planned, decided or found."
from = "plan"

# Marks one sub-phase and moves its prose under another, so the text has
# one copy and the name survives. See docs/method.md#fold.
[transitions.fold]
kind   = "mark-bullet"
doc    = "docs/method.md#fold"
help   = "Fold one sub-phase into another: its prose moves there, and it is marked merged."
from   = "plan"
marks  = "merged"
merges = true
drops  = ["sub-phase-status"]

[transitions.decline]
kind     = "move"
doc      = "docs/method.md#decline"
help     = "Set an item aside, because we chose not to do the work."
from     = "plan"
to       = "abandoned"
archives = true

# The same decision one state back, and a plain move:
# `someday-maybe` numbers nothing, so there is no entry to file.
[transitions.discard]
kind = "move"
doc  = "docs/method.md#discard"
help = "Discard an idea we are not going to act on."
from = "someday-maybe"
to   = "abandoned"

# Requires the cursor only. The status key is dropped by the marking
# transitions just before a close-out, so it must not be required here.
[transitions.archive-plan]
kind     = "close"
doc      = "docs/method.md#archive-plan"
help     = "Close a section out: file its archive entry and remove the item."
from     = "plan"
archives = true
requires = ["sub-phase"]

[transitions.merge]
kind = "merge"
doc  = "docs/method.md#merge"
help = "Absorb an idea into another item: the work continues as that item."
from = "someday-maybe"

[transitions.investigate]
kind = "create"
doc  = "docs/method.md#investigate"
help = "Open a carrier for an investigation."
to   = "carrier"
sets = ["opened-for", "opened-in"]

[transitions.note]
kind = "add-bullet"
doc  = "docs/method.md#note"
help = "Write a finding into an open carrier."
from = "carrier"

# The three ways to deal with a finding. Each writes its word on the bullet.
[transitions.fix-it]
kind  = "mark-bullet"
doc   = "docs/method.md#fix-it"
help  = "The finding was simple: say it is fixed and move on."
from  = "carrier"
marks = "fixed"

[transitions.dismiss]
kind  = "mark-bullet"
doc   = "docs/method.md#dismiss"
help  = "This finding is not worth acting on."
from  = "carrier"
marks = "dismissed"

[transitions.file-it]
kind  = "mark-bullet"
doc   = "docs/method.md#file-it"
help  = "File this finding as an item of its own."
from  = "carrier"
marks = "filed"

[transitions.file-it.files]
state = "someday-maybe"
item  = "carried-from"
name  = "carried"

# How to tell the session PID: the first of these that is set wins.
[identity]
doc = "docs/method.md#the-claim"
pid = ["CLAUDE_PID", "FILEPLAN_PID"]
