# Composed by roots from: python, the product.
# Edit those fragments, not this file; `roots compose` regenerates it.

[project]
# fileplan ships to PyPI, so it keeps its own floor, which wins over
# python's (C4). `make test-floor` runs the tests on it.
requires-python = ">=3.12"
name = "fileplan"
version = "0.12.0"
description = "A plan.toml interpreter: declared states, transitions and keys for filing work across sessions"
readme = "README.md"
authors = [
    { name = "John Borwick", email = "john_borwick@pobox.com" }
]
dependencies = [
    "click>=8.1",
    "dulwich>=1.2.14",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
# PEP 639 forbids a `License ::` classifier beside the expression above, and
# the build refuses one — so the habit of adding it is the mistake to make
# loud rather than to remember. `tests/test_packaging.py` asserts its absence.
classifiers = [
    # A judgment, not a measurement: the tool is complete and tested, and its
    # interfaces have not yet been through anybody else's hands. Beta is what
    # that looks like to somebody reading the project page.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/borwick/fileplan"
Repository = "https://github.com/borwick/fileplan"
Documentation = "https://github.com/borwick/fileplan/blob/main/docs/index.md"
Issues = "https://github.com/borwick/fileplan/issues"

[project.scripts]
fileplan = "fileplan.cli:console_main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.8", "ruff>=0.17"]

[tool.uv]
# Resolve only releases at least a week old. Days or weeks: uv takes
# "1 month" with a warning and then applies no cutoff. A security release
# is exempted per package with exclude-newer-package in the override.
exclude-newer = "1 week"

[tool.pytest.ini_options]
# publish/ holds the pipeline's tests. python gives `tests`, and arrays union.
testpaths = ["tests"]

[tool.ruff.lint]
# ruff's default rule set, which ruff changes only in a minor release, plus
# print() (T20) and naive datetimes (DTZ). No select; the version comes
# from requires-python.
extend-select = ["T20", "DTZ"]
