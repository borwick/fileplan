
[project]
# fileplan keeps its own floor, which wins over python's (PYTHON-LOCAL.md
# says why). `make test-floor` runs the tests on it.
requires-python = ">=3.12"
name = "fileplan"
version = "0.14.0"
description = "A plan.toml interpreter: declared states, transitions and keys for filing work across sessions"
readme = "README.md"
authors = [
    { name = "John Borwick", email = "john_borwick@pobox.com" }
]
dependencies = [
    "click>=8.1",
    "dulwich>=1.2.14",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    # A judgment, not a measurement: the tool is complete and tested, and its
    # interfaces have not yet been through anybody else's hands. Beta is what
    # that looks like to somebody reading the project page.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/borwick/fileplan"
Repository = "https://github.com/borwick/fileplan"
Documentation = "https://github.com/borwick/fileplan/blob/main/docs/index.md"
Issues = "https://github.com/borwick/fileplan/issues"

[project.scripts]
fileplan = "fileplan.cli:console_main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # 8.2 sets PYTEST_VERSION, which django's settings read as TESTING.
    "pytest>=8.2",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
]

[tool.uv]
# PYTHON.md, *Resolve only releases at least a week old*.
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# PYTHON.md, *ruff is the gate*. No select, so ruff's default set
# stays; the version comes from requires-python.
extend-select = ["T20", "DTZ", "B", "PTH", "RUF043", "RUF100"]
