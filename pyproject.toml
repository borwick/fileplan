[project]
name = "fileplan"
version = "0.5.0"
description = "A plan.toml interpreter: declared states, transitions and keys for filing work across sessions"
readme = "README.md"
authors = [
    { name = "John Borwick", email = "john_borwick@pobox.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "dulwich>=1.2.14",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

# PEP 639 forbids a `License ::` classifier beside the expression above, and
# the build refuses one — so the habit of adding it is the mistake to make
# loud rather than to remember. `tests/test_packaging.py` asserts its absence.
classifiers = [
    # A judgment, not a measurement: the tool is complete and tested, and its
    # interfaces have not yet been through anybody else's hands. Beta is what
    # that looks like to somebody reading the project page.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/borwick/fileplan"
Repository = "https://github.com/borwick/fileplan"
Documentation = "https://github.com/borwick/fileplan/blob/main/docs/index.md"
Issues = "https://github.com/borwick/fileplan/issues"

[project.scripts]
fileplan = "fileplan.cli:console_main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Tests are excluded because a test caller must never justify production code:
# left in the scan, a test import silently falsifies the premise of
# `internal-only` and `single-call-site`, and that disproof settles nothing.
# The three patterns cover where a test can land — `tests/` is the directory,
# `test_*` the filename convention wherever it sits, and `conftest.py` is
# neither.
[tool.pysmelly]
exclude = ["tests/", "test_*", "conftest.py"]
