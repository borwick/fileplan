# Your workflow, declared. A state is a directory, a transition moves an
# item between states, and a key is a fact an item carries. Every name here
# is a placeholder: rename them to your own words.
#
# Run `fileplan` to see what this declares, and `fileplan COMMAND --help` for
# what one command takes. Everything else the tool can do is a line or two
# here, and so is a [fileplan] table naming the oldest release this file
# needs. The initialization document in fileplan's repository walks through
# them.

[states.inbox]

# Ordered, and each item numbered as it arrives. A closed item's entry is
# filed in the archive document under its number.
[states.plan]
capabilities = ["queued", "numbered"]
archive      = "archive.md"

[keys.status]
help   = "How the work is going."
values = ["in progress", "waiting"]

[transitions.capture]
kind = "create"
to   = "inbox"

[transitions.queue]
kind = "move"
from = "inbox"
to   = "plan"

[transitions.work]
kind = "edit"
from = "plan"
sets = ["status"]

[transitions.archive]
kind     = "close"
from     = "plan"
archives = true
